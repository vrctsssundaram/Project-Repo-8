name: Generic RTL synthesis
on: [push, pull_request, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Synthesize roi_stream_crop
        run: yosys -Q -T -p 'read_verilog -sv rtl/roi_stream_crop.sv; hierarchy -check -top roi_stream_crop; synth -top roi_stream_crop; stat'
